<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WageGap AI — Criar nova senha</title>

<!--
  reset-password.html
  -------------------
  Aberta pelo link do e-mail de recuperação:
  reset-password.html?token=<token>
  O token vai para POST /api/auth/reset-password junto com a nova senha.
-->

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Estilos: o design system base (style.css) + os componentes de autenticação (auth.css) -->
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <!-- Logo centralizada -->
    <div class="auth-logo-wrap">
      <div class="auth-logo-mark">W</div>
      <div class="auth-logo-name">WageGap AI</div>
      <div class="auth-logo-sub">Diagnóstico de disparidade salarial<br>RAIS · CAGED</div>
    </div>

    <div class="auth-icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>

    <h1 class="auth-heading">Criar nova senha</h1>
    <p class="auth-subheading">Escolha uma senha com pelo menos 6 caracteres.</p>

    <!-- Erro vindo da API (link inválido/expirado) ou falta de token. Oculto até o JS exibir. -->
    <div class="auth-alert" id="rp-alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
      </svg>
      <span id="rp-alert-text">Não foi possível alterar a senha agora. Tente novamente.</span>
    </div>

    <form class="auth-form" id="rp-form" novalidate>

      <div class="field">
        <label for="rp-senha">Nova senha</label>

        <div class="password-field-wrap">
          <input type="password" id="rp-senha" name="senha" placeholder="••••••••" autocomplete="new-password">

          <button type="button" class="toggle-password" id="toggle-rp-senha" aria-label="Mostrar senha">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19m-6.2-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>

        <div class="field-error-msg" id="rp-senha-error"></div>
      </div>

      <div class="field">
        <label for="rp-senha2">Confirmar nova senha</label>

        <div class="password-field-wrap">
          <input type="password" id="rp-senha2" name="senha2" placeholder="••••••••" autocomplete="new-password">

          <button type="button" class="toggle-password" id="toggle-rp-senha2" aria-label="Mostrar senha">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19m-6.2-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>

        <div class="field-error-msg" id="rp-senha2-error"></div>
      </div>

      <button type="submit" class="btn-apply btn-block" id="rp-submit">
        <span class="btn-spinner"></span>
        <span class="btn-label">Salvar nova senha</span>
      </button>

    </form>

    <!-- Confirmação. Fica oculta até o reset-password.js exibir. -->
    <div class="auth-success-note" id="rp-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>
      <div>
        <strong>Senha alterada!</strong>
        <span>Você já pode entrar com a nova senha.</span>
      </div>
    </div>

    <div class="auth-back-row">
      <a href="login.html" class="link-gold">&larr; Ir para o login</a>
    </div>

    <div class="auth-foot-note">WageGap AI © 2026 — ODS 5 · 8 · 10</div>

  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/reset-password.js"></script>
</body>
</html>
