services:
  # Serviço do Front-end (Nginx)
  frontend:
    build: ./Front-end
    ports:
      - "8080:80"
    volumes:
      - ./Front-end:/usr/share/nginx/html

  # Serviço do Back-end (FastAPI)
  backend:
    build: ./Back-end
    ports:
      - "8000:8000"
    # Credenciais do e-mail (SMTP_*), fora do git. Sem o arquivo, a API sobe
    # normalmente e os e-mails (2FA, recuperação de senha) só aparecem no log.
    # Modelo: Back-end/.env.example
    env_file:
      - path: ./Back-end/.env
        required: false
    # "environment" tem prioridade sobre o env_file
    environment:
      DB_HOST: database
      DB_USER: dev_user
      DB_PASSWORD: devpassword
      DB_NAME: wagegap_db
      DB_PORT: 3306
    depends_on:
      - database
    volumes:
      - ./Back-end:/app

  # Pipeline de dados. Não sobe com o "up", roda assim:
  #   docker compose run --rm pipeline python -m src.run --ano 2024 --regiao NORTE
  pipeline:
    build: ./Pipeline
    profiles: ["pipeline"]
    environment:
      DB_HOST: database
      DB_USER: dev_user
      DB_PASSWORD: devpassword
      DB_NAME: wagegap_db
      DB_PORT: 3306
    depends_on:
      - database
    volumes:
      - ./Pipeline:/app

  # Serviço do Banco de Dados (MySQL 8.0)
  database:
    image: mysql:8.0
    container_name: wagegap_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wagegap_db
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - ./Back-end/database/init.sql:/docker-entrypoint-initdb.d/init.sql